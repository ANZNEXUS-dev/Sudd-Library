backend:
  name: github
  repo: ANZNEXUS-dev/sudd-library
  branch: main
  base_url: https://sudd-library-auth.anznexus.workers.dev
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "resources"
    label: "Resources"
    folder: "src/content/resources"
    create: true
    format: "json"
    slug: "{{fields.level}}-{{fields.classSlug}}-{{fields.subjectSlug}}-{{fields.type}}-{{fields.title}}"
    fields:
      - { label: "Level", name: "level", widget: "select", options: ["primary", "secondary", "aes"] }
      - { label: "Class Slug", name: "classSlug", widget: "string", hint: "e.g. p1, s4, alp — see src/data/curriculum.ts for the full list" }
      - { label: "Subject Slug", name: "subjectSlug", widget: "string", hint: "e.g. mathematics, cre — see src/data/curriculum.ts" }
      - label: "Resource Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Textbooks", value: "textbooks" }
          - { label: "Lesson Notes", value: "notes" }
          - { label: "Schemes of Work", value: "schemes" }
          - { label: "Past Papers", value: "past-papers" }
          - { label: "Holiday Packages", value: "holiday-packages" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Exam Board", name: "examBoard", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "number", value_type: "int", required: false }
      - { label: "File URL", name: "fileUrl", widget: "string", hint: "Direct .pdf link, or a site-relative path starting with /" }
      - { label: "File Size", name: "fileSize", widget: "string", required: false, hint: "e.g. 1.1 MB" }
      - { label: "Marking Scheme URL", name: "markingSchemeUrl", widget: "string", required: false }
      - { label: "Marking Scheme Size", name: "markingSchemeSize", widget: "string", required: false }
      - { label: "Date Added", name: "dateAdded", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
