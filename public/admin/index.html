<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudd Library — Content Admin</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <div id="nc-root"></div>

  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    async function uploadToR2(file) {
      const userData = window.localStorage.getItem('netlify-cms-user');
      const token = userData ? JSON.parse(userData).token : null;
      if (!token) throw new Error('Not authenticated');

      const presignResp = await fetch('https://sudd-library-auth.anznexus.workers.dev/media/presign', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify({ filename: file.name, contentType: file.type }),
      });
      if (!presignResp.ok) throw new Error('Failed to get upload URL');

      const { uploadUrl, publicUrl } = await presignResp.json();

      const uploadResp = await fetch(uploadUrl, {
        method: 'PUT',
        headers: { 'Content-Type': file.type },
        body: file,
      });
      if (!uploadResp.ok) throw new Error('Upload to R2 failed');

      return publicUrl;
    }

    async function init({ handleInsert }) {
      return {
        show: () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;
            try {
              const publicUrl = await uploadToR2(file);
              handleInsert(publicUrl);
            } catch (err) {
              alert(err.message);
            }
          };
          input.click();
        },
        enableStandalone: () => true,
      };
    }

    CMS.registerMediaLibrary({ name: 'r2', init });
    CMS.init();
  </script>
</body>
</html>
